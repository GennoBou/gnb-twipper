name: Release & Store Auto-Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_store:
        description: 'Target store to publish (default: none)'
        required: true
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'chrome'
          - 'firefox'
          - 'edge'
          - 'all'
      create_github_release:
        description: 'Create or update GitHub Release when triggered manually'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    name: Build, Release & Publish to Web Stores
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup wepub
        uses: iorate/wepub/setup@fc99f54390af6bc8218d1eeda0a994198cd25831 # v1

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Svelte & TypeScript check
        run: npm run check

      - name: Build extension bundle
        run: npm run build

      - name: Package extension ZIPs (Chrome / Edge, Firefox & Source)
        run: node scripts/package-zip.js

      - name: Create GitHub Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_github_release == true
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            chrome-extension-${{ steps.meta.outputs.tag }}.zip
            firefox-extension-${{ steps.meta.outputs.tag }}.zip
            source-code-${{ steps.meta.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Chrome Web Store
        if: inputs.target_store == 'chrome' || inputs.target_store == 'all'
        env:
          WEPUB_CHROME_PUBLISHER_ID: ${{ secrets.WEPUB_CHROME_PUBLISHER_ID || secrets.CHROME_PUBLISHER_ID }}
          WEPUB_CHROME_ITEM_ID: ${{ secrets.WEPUB_CHROME_ITEM_ID || secrets.CHROME_EXTENSION_ID || 'hdnejkdhkppofpinlnloidcollpcjdfl' }}
          WEPUB_CHROME_CLIENT_ID: ${{ secrets.WEPUB_CHROME_CLIENT_ID || secrets.CHROME_CLIENT_ID }}
          WEPUB_CHROME_CLIENT_SECRET: ${{ secrets.WEPUB_CHROME_CLIENT_SECRET || secrets.CHROME_CLIENT_SECRET }}
          WEPUB_CHROME_REFRESH_TOKEN: ${{ secrets.WEPUB_CHROME_REFRESH_TOKEN || secrets.CHROME_REFRESH_TOKEN }}
        run: |
          export WEPUB_CHROME_PUBLISHER_ID=$(echo -n "$WEPUB_CHROME_PUBLISHER_ID" | tr -d '[:space:]')
          export WEPUB_CHROME_ITEM_ID=$(echo -n "$WEPUB_CHROME_ITEM_ID" | tr -d '[:space:]')
          export WEPUB_CHROME_CLIENT_ID=$(echo -n "$WEPUB_CHROME_CLIENT_ID" | tr -d '[:space:]')
          export WEPUB_CHROME_CLIENT_SECRET=$(echo -n "$WEPUB_CHROME_CLIENT_SECRET" | tr -d '[:space:]')
          export WEPUB_CHROME_REFRESH_TOKEN=$(echo -n "$WEPUB_CHROME_REFRESH_TOKEN" | tr -d '[:space:]')
          if [[ ! "$WEPUB_CHROME_PUBLISHER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::warning::WEPUB_CHROME_PUBLISHER_ID does not look like a 36-char UUID (length: ${#WEPUB_CHROME_PUBLISHER_ID})."
          fi
          wepub chrome "chrome-extension-${{ steps.meta.outputs.tag }}.zip"

      - name: Publish to Firefox Add-ons
        if: inputs.target_store == 'firefox' || inputs.target_store == 'all'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          WEPUB_FIREFOX_ADDON_ID: ${{ secrets.WEPUB_FIREFOX_ADDON_ID || 'gnb-twipper@gennobou.com' }}
          WEPUB_FIREFOX_API_KEY: ${{ secrets.WEPUB_FIREFOX_API_KEY || secrets.WEB_EXT_API_KEY }}
          WEPUB_FIREFOX_API_SECRET: ${{ secrets.WEPUB_FIREFOX_API_SECRET || secrets.WEB_EXT_API_SECRET }}
        run: |
          export WEPUB_FIREFOX_ADDON_ID=$(echo -n "$WEPUB_FIREFOX_ADDON_ID" | tr -d '[:space:]')
          export WEPUB_FIREFOX_API_KEY=$(echo -n "$WEPUB_FIREFOX_API_KEY" | tr -d '[:space:]')
          export WEPUB_FIREFOX_API_SECRET=$(echo -n "$WEPUB_FIREFOX_API_SECRET" | tr -d '[:space:]')
          node -e '
            const fs = require("fs");
            const tag = (process.env.RELEASE_TAG || "").replace(/^v/, "");
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = tag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`^## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=^---\\s*$|^## \\[|(?![\\s\\S]))`, "m");
            const match = md.match(re);
            if (match && match[1].trim()) {
              fs.writeFileSync("release-notes.md", match[1].trim() + "\n", "utf8");
            }
          '
          NOTES_ARGS=()
          if [[ -s release-notes.md ]]; then
            NOTES_ARGS=(--release-notes-file release-notes.md)
          fi
          wepub firefox --channel listed "${NOTES_ARGS[@]}" --source "source-code-${RELEASE_TAG}.zip" "firefox-extension-${RELEASE_TAG}.zip"

      - name: Publish to Microsoft Edge Add-ons
        if: inputs.target_store == 'edge' || inputs.target_store == 'all'
        env:
          WEPUB_EDGE_PRODUCT_ID: ${{ secrets.WEPUB_EDGE_PRODUCT_ID }}
          WEPUB_EDGE_CLIENT_ID: ${{ secrets.WEPUB_EDGE_CLIENT_ID }}
          WEPUB_EDGE_API_KEY: ${{ secrets.WEPUB_EDGE_API_KEY }}
        run: |
          export WEPUB_EDGE_PRODUCT_ID=$(echo -n "$WEPUB_EDGE_PRODUCT_ID" | tr -d '[:space:]')
          export WEPUB_EDGE_CLIENT_ID=$(echo -n "$WEPUB_EDGE_CLIENT_ID" | tr -d '[:space:]')
          export WEPUB_EDGE_API_KEY=$(echo -n "$WEPUB_EDGE_API_KEY" | tr -d '[:space:]')
          if [[ ! "$WEPUB_EDGE_PRODUCT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::warning::WEPUB_EDGE_PRODUCT_ID does not look like a 36-char GUID/UUID (length: ${#WEPUB_EDGE_PRODUCT_ID}). Note: Edge API requires the Partner Center Product ID (GUID), not the 32-char Store CRX ID."
          fi
          wepub edge "chrome-extension-${{ steps.meta.outputs.tag }}.zip"
