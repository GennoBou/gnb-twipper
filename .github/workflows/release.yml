name: Release & Store Auto-Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Release & Publish to Web Stores
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte & TypeScript check
        run: npm run check

      - name: Build extension bundle
        run: npm run build

      - name: Package extension ZIP for Chrome / Opera
        run: |
          cd dist
          zip -r ../chrome-extension-${{ github.ref_name }}.zip .
          cd ..

      - name: Package extension ZIP for Firefox
        run: |
          cd dist
          zip -r ../firefox-extension-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            chrome-extension-${{ github.ref_name }}.zip
            firefox-extension-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Chrome Web Store (Optional)
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        if: env.CHROME_CLIENT_ID != '' && env.CHROME_EXTENSION_ID != ''
        run: |
          npx chrome-webstore-upload-cli upload --source chrome-extension-${{ github.ref_name }}.zip --extension-id $CHROME_EXTENSION_ID --client-id $CHROME_CLIENT_ID --client-secret $CHROME_CLIENT_SECRET --refresh-token $CHROME_REFRESH_TOKEN

      - name: Sign & Upload to Firefox Add-ons (Optional)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: |
          npx web-ext sign --source-dir dist --api-key $WEB_EXT_API_KEY --api-secret $WEB_EXT_API_SECRET
